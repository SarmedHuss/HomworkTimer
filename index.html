<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hausaufgaben-Timer</title>
  <meta name="description" content="Hausaufgaben mit Grundschulkindern planen, mit dem Bleistift-Timer lernen und danach kurz bewerten. Homework timer for primary school kids and their parents.">
  <meta name="theme-color" content="#f2f4f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lern-Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

  <!-- ================= ELTERNMODUS ================= -->

  <!-- Kinderprofil anlegen / bearbeiten -->
  <main id="screen-profile" class="screen parent">
    <div class="p-wrap">
      <div class="p-bar end">
        <div class="lang" role="group" data-i18n-aria="lang.label">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <header class="p-head">
        <img src="icons/icon-192.png" alt="" class="app-mark" width="48" height="48">
        <h1 id="profile-title"></h1>
        <p class="lead" data-i18n="profile.lead"></p>
      </header>

      <form id="profile-form" class="p-form" autocomplete="off">
        <label class="field">
          <span class="field-label" data-i18n="profile.name"></span>
          <input id="profile-name" type="text" maxlength="20" required data-i18n-ph="profile.namePh">
        </label>

        <fieldset class="choice">
          <legend data-i18n="profile.grade"></legend>
          <div class="options" id="profile-grade">
            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>
            <button type="button" value="4">4</button>
          </div>
          <p class="help" data-i18n="profile.gradeHelp"></p>
        </fieldset>

        <fieldset class="choice" id="profile-subjects-wrap">
          <legend data-i18n="profile.subjects"></legend>
          <div class="chips removable" id="profile-subjects"></div>
          <p class="help" data-i18n="profile.subjectsHelp"></p>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-big" data-i18n="profile.save"></button>
        <button type="button" id="profile-cancel" class="btn btn-quiet" data-i18n="profile.cancel"></button>
        <button type="button" id="profile-delete" class="btn btn-danger" data-i18n="profile.delete"></button>
      </form>
    </div>
  </main>

  <!-- Planen (Startseite der Eltern) -->
  <main id="screen-plan" class="screen parent">
    <div class="p-wrap">
      <header class="p-bar">
        <span class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"> <span data-i18n="app.short"></span></span>
        <div class="lang" role="group" data-i18n-aria="lang.label">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </header>

      <nav class="kids" data-i18n-aria="plan.kids">
        <div id="kid-list" class="kid-list"></div>
        <button type="button" id="kid-add" class="kid-chip kid-add" data-i18n="plan.addKid"></button>
      </nav>

      <div class="plan-title">
        <h1 id="plan-heading"></h1>
        <button type="button" id="kid-edit" class="link" data-i18n="plan.editProfile"></button>
      </div>

      <form id="plan-form" class="p-form">
        <fieldset class="choice">
          <legend data-i18n="plan.subject"></legend>
          <div class="chips" data-name="subject" id="subject-chips"></div>
          <div id="subject-add" class="add-row" hidden>
            <input id="subject-input" type="text" maxlength="24" autocomplete="off" data-i18n-ph="plan.subjectPh">
            <button type="button" id="subject-save" class="btn btn-small" data-i18n="plan.subjectAdd"></button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend data-i18n="plan.focus"></legend>
          <div class="options" data-name="focus">
            <button type="button" value="5">5</button>
            <button type="button" value="10">10</button>
            <button type="button" value="12">12</button>
            <button type="button" value="15">15</button>
            <button type="button" value="20">20</button>
            <button type="button" value="25">25</button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend data-i18n="plan.break"></legend>
          <div class="options" data-name="break">
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>
            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="8">8</button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend data-i18n="plan.rounds"></legend>
          <div class="options" data-name="rounds">
            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>
            <button type="button" value="4">4</button>
          </div>
        </fieldset>

        <div class="pair">
          <fieldset class="choice">
            <legend data-i18n="plan.showTime"></legend>
            <div class="options" data-name="showTime">
              <button type="button" value="on" data-i18n="on"></button>
              <button type="button" value="off" data-i18n="off"></button>
            </div>
          </fieldset>
          <fieldset class="choice">
            <legend data-i18n="plan.sound"></legend>
            <div class="options" data-name="sound">
              <button type="button" value="on" data-i18n="on"></button>
              <button type="button" value="off" data-i18n="off"></button>
            </div>
          </fieldset>
        </div>

        <p id="summary" class="summary"></p>

        <button type="submit" class="btn btn-primary btn-big" data-i18n="plan.start"></button>
        <p class="help center" data-i18n="plan.handHint"></p>
      </form>

      <div class="p-links">
        <button type="button" id="open-history" class="btn btn-secondary"></button>
        <button type="button" id="open-data" class="btn btn-secondary" data-i18n="plan.data"></button>
        <button type="button" class="btn btn-quiet" disabled data-i18n="plan.feedback"></button>
      </div>

      <p id="install-hint" class="install-hint" hidden data-i18n="plan.installHint"></p>
    </div>
  </main>

  <!-- Bewertung nach der Sitzung -->
  <main id="screen-rate" class="screen parent">
    <div class="p-wrap">
      <header class="p-head left">
        <h1 id="rate-heading"></h1>
        <p id="rate-sub" class="lead"></p>
      </header>

      <form id="rate-form" class="p-form">
        <fieldset class="choice">
          <legend id="q-focus"></legend>
          <div class="options rate" data-name="focus">
            <button type="button" value="5" data-i18n="rate.focus.5"></button>
            <button type="button" value="4" data-i18n="rate.focus.4"></button>
            <button type="button" value="3" data-i18n="rate.focus.3"></button>
            <button type="button" value="2" data-i18n="rate.focus.2"></button>
            <button type="button" value="1" data-i18n="rate.focus.1"></button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend data-i18n="rate.helpQ"></legend>
          <div class="options rate" data-name="help">
            <button type="button" value="5" data-i18n="rate.help.5"></button>
            <button type="button" value="4" data-i18n="rate.help.4"></button>
            <button type="button" value="3" data-i18n="rate.help.3"></button>
            <button type="button" value="2" data-i18n="rate.help.2"></button>
            <button type="button" value="1" data-i18n="rate.help.1"></button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend id="q-child"></legend>
          <div class="options faces" data-name="childMood">
            <button type="button" value="3"><span class="face" aria-hidden="true">😊</span><span data-i18n="rate.child.3"></span></button>
            <button type="button" value="2"><span class="face" aria-hidden="true">😐</span><span data-i18n="rate.child.2"></span></button>
            <button type="button" value="1"><span class="face" aria-hidden="true">😣</span><span data-i18n="rate.child.1"></span></button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend data-i18n="rate.parentQ"></legend>
          <div class="options faces" data-name="parentMood">
            <button type="button" value="3"><span class="face" aria-hidden="true">😌</span><span data-i18n="rate.parent.3"></span></button>
            <button type="button" value="2"><span class="face" aria-hidden="true">😬</span><span data-i18n="rate.parent.2"></span></button>
            <button type="button" value="1"><span class="face" aria-hidden="true">😤</span><span data-i18n="rate.parent.1"></span></button>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend data-i18n="rate.diffQ"></legend>
          <div class="options" data-name="difficulty">
            <button type="button" value="easy" data-i18n="rate.diff.easy"></button>
            <button type="button" value="ok" data-i18n="rate.diff.ok"></button>
            <button type="button" value="hard" data-i18n="rate.diff.hard"></button>
          </div>
        </fieldset>

        <label class="field">
          <span class="field-label"><span data-i18n="rate.note"></span> <span class="optional" data-i18n="rate.optional"></span></span>
          <textarea id="rate-note" rows="3" maxlength="500" data-i18n-ph="rate.notePh"></textarea>
        </label>

        <button type="submit" class="btn btn-primary btn-big" data-i18n="rate.save"></button>
        <button type="button" id="rate-skip" class="btn btn-quiet" data-i18n="rate.skip"></button>
      </form>
    </div>
  </main>

  <!-- Verlauf -->
  <main id="screen-history" class="screen parent">
    <div class="p-wrap">
      <header class="p-bar">
        <button type="button" id="history-back" class="link" data-i18n="history.back"></button>
      </header>
      <h1 id="history-heading" class="h-title"></h1>
      <p id="history-stats" class="lead left"></p>
      <ol id="history-list" class="history"></ol>
      <p id="history-empty" class="empty" hidden data-i18n="history.empty"></p>
    </div>
  </main>

  <!-- Daten exportieren / sichern -->
  <main id="screen-data" class="screen parent">
    <div class="p-wrap">
      <header class="p-bar">
        <button type="button" id="data-back" class="link" data-i18n="history.back"></button>
      </header>
      <h1 class="h-title" data-i18n="data.title"></h1>
      <p class="lead left" data-i18n="data.lead"></p>

      <section class="card">
        <h2 data-i18n="data.csvTitle"></h2>
        <p id="data-csv-text"></p>
        <button type="button" id="export-csv" class="btn btn-primary btn-block" data-i18n="data.csvButton"></button>
      </section>

      <section class="card">
        <h2 data-i18n="data.backupTitle"></h2>
        <p data-i18n="data.backupText"></p>
        <button type="button" id="export-backup" class="btn btn-primary btn-block" data-i18n="data.backupButton"></button>
        <button type="button" id="import-backup" class="btn btn-secondary btn-block" data-i18n="data.restoreButton"></button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </section>

      <p id="data-status" class="status" role="status"></p>
      <p class="help" data-i18n="data.privacy"></p>
    </div>
  </main>

  <!-- ================= KINDMODUS ================= -->

  <main id="screen-timer" class="screen" data-phase="focus">
    <ol id="rounds" class="rounds"></ol>

    <div class="readout">
      <p id="phase-title" class="phase-label"></p>
      <p id="time" class="time"></p>
    </div>

    <div id="pencil" class="pencil pencil-main" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div>

    <div class="timer-controls">
      <button id="btn-toggle" class="btn btn-primary btn-big" type="button"></button>
      <button id="btn-stop" class="btn btn-quiet hold" type="button" aria-describedby="stop-hint">
        <span class="hold-fill" aria-hidden="true"></span>
        <span class="hold-label" data-i18n="timer.stop"></span>
      </button>
      <p id="stop-hint" class="hint" data-i18n="timer.stopHint"></p>
    </div>
  </main>

  <main id="screen-switch" class="screen">
    <div class="switch-card">
      <ol id="rounds-switch" class="rounds rounds-big"></ol>
      <h2 id="switch-title"></h2>
      <p id="switch-text"></p>
      <button id="btn-next" class="btn btn-primary btn-big" type="button"></button>
    </div>
  </main>

  <main id="screen-done" class="screen">
    <div class="switch-card">
      <ol id="rounds-done" class="rounds rounds-big"></ol>
      <h2 data-i18n="done.title"></h2>
      <p id="done-text"></p>
      <button id="btn-handover" class="btn btn-primary btn-big" type="button" data-i18n="done.button"></button>
      <p class="hint" data-i18n="done.hint"></p>
    </div>
  </main>

  <!-- Sicherheitsnetz: falls die App nicht startet, statt leerer Seite einen Hinweis zeigen -->
  <main id="screen-error" class="screen parent">
    <div class="p-wrap">
      <header class="p-head">
        <img src="icons/icon-192.png" alt="" class="app-mark" width="48" height="48">
        <h1>Die App konnte nicht starten</h1>
        <p class="lead">Meist hilft neu laden. / The app couldn't start. Reloading usually fixes it.</p>
      </header>
      <button type="button" id="btn-reload" class="btn btn-primary btn-big">Neu laden / Reload</button>
    </div>
  </main>

  <!-- ?v= bei jeder Änderung zusammen mit VERSION in sw.js erhöhen -->
  <script src="i18n.js?v=8"></script>
  <script src="app.js?v=8"></script>
  <script>
    (function () {
      function fail() {
        if (document.querySelector(".screen[data-active]")) return;
        document.getElementById("screen-error").setAttribute("data-active", "");
      }
      window.addEventListener("error", function () { setTimeout(fail, 0); });
      window.addEventListener("load", function () { setTimeout(fail, 300); });
      document.getElementById("btn-reload").addEventListener("click", function () {
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      });
    })();
  </script>
</body>
</html>
