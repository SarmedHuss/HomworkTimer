name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Webseiten-Dateien zusammenstellen
        run: |
          # Alle Dateien der App veröffentlichen, außer Git-, Workflow- und Doku-Dateien
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./README.md -cf - . | tar -xf - -C _site
          # Prüfen, dass jede in index.html eingebundene Datei auch da ist
          for f in $(grep -oE '(src|href)="[^"#:]+' index.html | sed -E 's/^(src|href)="//; s/\?.*//' | sort -u); do
            test -f "_site/$f" || { echo "Fehlt: $f"; exit 1; }
          done
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
